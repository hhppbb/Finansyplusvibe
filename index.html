<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест: Финансы (ДМ 1)</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#dcdad3;--ac:#2f5d50;--acx:#fff;--ok:#e3f2e6;--okb:#2e7d32;--no:#fbe4e2;--nob:#c62828;--hint:#fff6dc;--hintb:#b58900;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171917;--card:#222522;--tx:#ecebe6;--mut:#a3a29c;--bd:#3a3d3a;--ac:#7fc4ae;--acx:#10211c;--ok:#1d3a22;--okb:#66bb6a;--no:#40201e;--nob:#ef7a73;--hint:#3a3217;--hintb:#d9b441}}
:root[data-theme="dark"]{--bg:#171917;--card:#222522;--tx:#ecebe6;--mut:#a3a29c;--bd:#3a3d3a;--ac:#7fc4ae;--acx:#10211c;--ok:#1d3a22;--okb:#66bb6a;--no:#40201e;--nob:#ef7a73;--hint:#3a3217;--hintb:#d9b441}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt .m{flex:none;width:22px;height:22px;border:2px solid var(--bd);border-radius:50%;display:grid;place-items:center;font-size:13px}
.opt.multi .m{border-radius:5px}.opt.sel{border-color:var(--ac)}.opt.sel .m{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.no{background:var(--no);border-color:var(--nob)}.opt:disabled{cursor:default}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:13px 18px;font:600 16px system-ui;width:100%;margin-top:8px;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.fb{border-radius:12px;padding:12px;margin-top:10px;font-size:15px}.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}.fb.hint{background:var(--hint);border:1px solid var(--hintb)}
.fb b{display:block;margin-bottom:4px}
label.row{display:flex;gap:10px;align-items:center;margin:10px 0}select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.tag{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin-right:6px}
</style></head><body><main id="app"></main>
<script>
const Q=[{"id": "1", "t": "1", "q": "Источниками финансовых ресурсов являются (несколько вар):", "o": ["стоимость ВВП", "доходы от ВЭД", "часть накопленного национального богатства"], "a": [0, 1, 2], "f": false}, {"id": "2", "t": "1", "q": "Финансовые отношения – это:", "o": ["Денежные отношения, связанные с оплатой товаров услуг", "Экономические отношения, связанные с образованием денежных фондов", "Экономические отношения, связанные с образованием, распределением и использованием фондов денежных средств"], "a": [2], "f": false}, {"id": "3", "t": "1", "q": "Совокупность денежных отношений, организованных государством, в процессе которых осуществляется формирование и использование общегосударственных фондов денежных средств для экономических, социальных и политических задач:", "o": ["Деньги", "Капитал", "Финансы"], "a": [2], "f": false}, {"id": "4", "t": "1", "q": "Частный труд, заключенный в товаре-эквиваленте:", "o": ["Есть форма проявления абстрактного, заключенного в товаре, выступающем в относительной форме стоимости", "Есть форма проявления общественной стоимости, заключенной в товаре, находящемся в относительной форме стоимости"], "a": [1], "f": false}, {"id": "5", "t": "1", "q": "Обязанность государства проводить перераспределение денежных средств для решения общегосударственных задач реализуется при помощи функции финансов:", "o": ["Распределительной", "Регулирующей", "Контрольной"], "a": [0], "f": false}, {"id": "6", "t": "1", "q": "Какие денежные отношения не относятся к финансовым:", "o": ["Между населением и предприятиями торговли", "Между предприятиями и госбюджетом по поводу внесения в бюджет", "При оплате коммунальных услуг", "Между населением по поводу дарения денежных средств"], "a": [3], "f": false}, {"id": "7", "t": "1", "q": "Что относится к финансовым рычагам (несколько вар.):", "o": ["Виды и ставки налогов", "Амортизация", "Дивиденды", "Процентные ставки"], "a": [0, 1, 2, 3], "f": false}, {"id": "8", "t": "1", "q": "Бартер означает обмен:", "o": ["Товара на товар с последующим обменом его на деньги", "Денег на товар", "Товара на товар", "Товара на деньги"], "a": [2], "f": false}, {"id": "9", "t": "1", "q": "Какое из утверждений неверно? Функциями финансов являются:", "o": ["Контрольная", "Регулирующая", "Распределительная", "Информационная"], "a": [3], "f": false}, {"id": "10", "t": "1", "q": "Функция финансов, связанная с вмешательством государства через финансы в процесс воспроизводства, называется:", "o": ["Распределительной", "Контролирующей", "Регулирующей", "Стимулирующей"], "a": [2], "f": false}, {"id": "11", "t": "1", "q": "Какие из нижеперечисленных функций относятся к функциям финансов (несколько вар.):", "o": ["Распределительная", "Функция финансирования", "Контрольная", "Регулирующая"], "a": [0, 2, 3], "f": false}, {"id": "12", "t": "1", "q": "Финансы как экономическая категория:", "o": ["Выступают в роли денег или в денежной форме", "Выражают отношения по поводу производства, распределения и использования ВВП", "Выступают в качестве связующего звена между созданием и использованием ВВП и НД"], "a": [1], "f": false}, {"id": "13", "t": "1", "q": "Финансы – это:", "o": ["Стимулирующая", "Распределительная категория", "Контролирующая категория"], "a": [1], "f": false}, {"id": "14", "t": "1", "q": "Предпосылками возникновения финансов НЕ является:", "o": ["Расслоение общества на классы", "Возникновение государства", "Появление рабов и рабовладельцев"], "a": [2], "f": false}, {"id": "15", "t": "1", "q": "Финансы – это:", "o": ["Экономические отношения", "Политические отношения", "Денежные отношения", "Реальные отношения"], "a": [2], "f": false}, {"id": "16", "t": "1", "q": "Какое из выражений неверно?\nФинансы – это:", "o": ["Распределительная категория", "Совокупность экономических отношений, образующих финансовую систему государства", "Перераспределительная категория"], "a": [2], "f": false}, {"id": "17", "t": "1", "q": "Термин «finansia» в переводе с латинского имеет значение:", "o": ["Денежный платеж", "Обмен", "Сделка"], "a": [0], "f": false}, {"id": "18", "t": "1", "q": "Подберите верный термин к определению: система отношений по поводу формирования, распределения и использования денежных средств:", "o": ["Финансовый контроль", "Финансы", "Денежный оборот"], "a": [1], "f": false}, {"id": "19", "t": "1", "q": "Изначально термин финансы подразумевал:", "o": ["Финансы предприятий", "Финансы домохозяйств", "Государственные финансы"], "a": [2], "f": false}, {"id": "20", "t": "1", "q": "К функциям финансов НЕ относится:", "o": ["Контрольная", "Замещения стоимости", "Распределительная"], "a": [1], "f": false}, {"id": "21", "t": "1", "q": "Финансы – это система денежных отношений связанных с формированием, распределением и использованием:", "o": ["Фондов денежных средств", "Материальных фондов", "Фондов государства", "Денег"], "a": [0], "f": false}, {"id": "22", "t": "1", "q": "Определяющими признаками финансов является:", "o": ["Это денежные отношения, которые носят фондовый характер", "Это денежные отношения, одной из сторон которых обязательно выступает государство", "Это отношения, связанные с формированием фондов денежных средств", "Это денежные отношения по поводу использования различных фондов"], "a": [0], "f": false}, {"id": "23", "t": "1", "q": "Финансы – это:", "o": ["Система экономических отношений по поводу использования денежных средств", "Специфические экономические отношения по поводу формирования фонда денежных средств за счет взносов и их использования на возмещение ущерба", "Экономические отношения, связанные с формированием, распределением и использованием фондов денежных средств в целях выполнения функций и задач государства и обеспечения условий расширенного воспроизводства."], "a": [2], "f": false}, {"id": "24", "t": "1", "q": "Какое из приведенных высказываний не является правильным:", "o": ["Финансы отличаются от денег по содержанию", "Финансы не отличаются от денег по выполняемым ими функциям", "Деньги – это всеобщий эквивалент", "Финансы – это экономический инструмент распределения и перераспределения ВВП и НД"], "a": [1], "f": false}, {"id": "25", "t": "1", "q": "Социально-экономическая сущность финансов проявляется в:", "o": ["Доходах бюджета", "Направления расходования денежных средств", "Бюджетном дефиците", "За счет каких групп экономических субъектов фонды формируются, в чью пользу распределяются"], "a": [3], "f": false}, {"id": "26", "t": "1", "q": "Регулирующая функция финансов связана с:", "o": ["Вмешательством в финансовую деятельность государства", "Вмешательством государства через финансы в процессе воспроизводства", "Регулированием государством финансовой деятельности через процесс воспроизводства"], "a": [1], "f": false}, {"id": "27", "t": "1", "q": "Участие финансов в распределении и перераспределении ВВП и национального дохода характеризуется _________ функцией финансов:", "o": ["Стимулирующей", "Распределительной", "Регулирующей", "Контрольной"], "a": [1], "f": false}, {"id": "28", "t": "1", "q": "Участие финансов в надзоре за эффективным использованием всех видов экономических ресурсов реализуется через ___________ функцию финансов:", "o": ["Регулирующую", "Распределительную", "Стимулирующую", "Контрольную"], "a": [3], "f": false}, {"id": "29", "t": "1", "q": "Формирование и использование фондов денежных средств предполагает реализация __________ функции финансов предприятия:", "o": ["Контрольной", "Распределительной", "Стимулирующей", "Производственной"], "a": [1], "f": false}, {"id": "30", "t": "1", "q": "Особенностью финансовых отношений является то, что:", "o": ["Финансовые отношения связаны с формированием и использованием фондов денежных средств государства и хозяйствующих субъектов", "Возникновение финансовых отношений обусловлено существованием государства", "Финансовые отношения – это перераспределительные отношения", "Финансовые отношения – это  всегда денежные отношения"], "a": [3], "f": false}, {"id": "31", "t": "1", "q": "К децентрализованным финансам не относятся
